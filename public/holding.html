<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Neural Day Trader — Em construção</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .badge {
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #22d3ee;
        border: 1px solid rgba(34, 211, 238, 0.3);
        border-radius: 999px;
        padding: 6px 14px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: clamp(24px, 4vw, 36px);
        font-weight: 500;
        margin: 0 0 12px;
        color: #f8fafc;
      }
      p {
        max-width: 480px;
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 8px;
        font-size: 15px;
      }
      .contact {
        margin-top: 28px;
        font-size: 14px;
        color: #64748b;
      }
      a { color: #22d3ee; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge">Em construção</div>
      <h1>Neural Day Trader está sendo reconstruído</h1>
      <p>
        Estamos revisando o produto antes de reabrir o acesso — sem pressa,
        sem promessa de resultado, e sem número que a gente não consiga
        provar de verdade.
      </p>
      <div class="contact">
        Dúvidas ou contato: <a href="mailto:clbrcouto@gmail.com">clbrcouto@gmail.com</a>
      </div>
    </div>
  </body>
</html>
